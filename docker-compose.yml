services:
  postgres:
    image: postgres:16
    container_name: flight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elango08
      POSTGRES_PASSWORD: elango08
      POSTGRES_DB: flight_booking_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_user -d flight_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: flight_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    build: ./backend
    container_name: flight_celery_worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --pool=solo
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://elango08:elango08@postgres:5432/flight_booking_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=skybookofficial0@gmail.com
      - SMTP_PASS=${SMTP_PASS:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-beat:
    build: ./backend
    container_name: flight_celery_beat
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://elango08:elango08@postgres:5432/flight_booking_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata: